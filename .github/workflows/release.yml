name: Release

# Push a tag like v1.0.0 to build ChapterMark.exe and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Passed via the environment, never pasted into scripts (avoids script injection).
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, test, build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Go tests
        run: go test ./...

      - name: Build exe
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          wails build -clean -ldflags "-X main.version=$env:TAG"

      - name: Package portable zip
        run: |
          New-Item -ItemType Directory -Path ChapterMark | Out-Null
          Copy-Item build/bin/ChapterMark.exe ChapterMark/
          Compress-Archive -Path ChapterMark -DestinationPath "ChapterMark-$env:TAG-windows.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Download the zip, extract the ChapterMark folder anywhere you can write to, and double-click ChapterMark.exe. The first time, Windows may say 'Windows protected your PC' because the exe isn't code-signed: click More info, then Run anyway."
          gh release create "$env:TAG" "ChapterMark-$env:TAG-windows.zip" --title "ChapterMark $env:TAG" --notes $notes
